services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ruralconnect
      MYSQL_USER: career
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes: [career_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/ruralconnect?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Kolkata
      DB_USER: career
      DB_PASSWORD: ${DB_PASSWORD}
      RCC_ADMIN_EMAIL: ${RCC_ADMIN_EMAIL:-admin@example.test}
      RCC_ADMIN_PASSWORD: ${RCC_ADMIN_PASSWORD:?Set initial administrator password}
      RCC_SEED: ${RCC_SEED:-false}
      RCC_EMPLOYER_PASSWORD: ${RCC_EMPLOYER_PASSWORD:-}
      RCC_SEEKER_PASSWORD: ${RCC_SEEKER_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TZ: Asia/Kolkata
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
volumes:
  career_data:
