spring.application.name=rural-career-connect
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ruralconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:career}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
spring.jackson.time-zone=Asia/Kolkata
spring.datasource.hikari.connection-init-sql=SET time_zone = '+05:30'
